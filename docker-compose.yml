services:
  frontend:
    build:
      context: ./ecommerce-app
      dockerfile: Dockerfile
    image: ecommerce-app:local
    ports:
      - "8080:8080"
    environment:
      - VITE_API_BASE_URL=https://fakestoreapi.com
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    read_only: true # container filesystem is immutable at runtime (defense in depth)
    tmpfs:
      # /var/log/nginx is deliberately NOT mounted here: the base image ships
      # access.log/error.log as symlinks to /dev/stdout /dev/stderr (docker
      # logs picks them up). Mounting tmpfs there would replace those
      # symlinks with an empty writable dir and break logging.
      - /var/cache/nginx
      - /var/run
      - /tmp
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
