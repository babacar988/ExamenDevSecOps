services:
  frontend:
    build:
      context: ./ecommerce-app
      dockerfile: Dockerfile
    image: ecommerce-app:local
    ports:
      - "8080:8080"
    networks:
      - app-net

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3
    command:
      - --nginx.scrape-uri=http://frontend:8080/stub_status
    depends_on:
      - frontend
    networks:
      - app-net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports:
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - app-net

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./observability/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    depends_on:
      - nginx-exporter
      - cadvisor
    networks:
      - app-net

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      # Host port 3001 (not 3000): port 3000 is a very common default for other
      # local dev servers (create-react-app, etc.) and frequently causes a
      # "port already in use" conflict on developer machines. The container
      # itself still listens on 3000 internally.
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=changeme # override via .env / secret in production
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
