server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hide nginx version banner (reduces information disclosure)
    server_tokens off;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://fakestoreapi.com; img-src 'self' https://fakestoreapi.com data:; script-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Lightweight endpoint for container HEALTHCHECK / k8s liveness probes
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Internal-only metrics endpoint, scraped by the nginx-prometheus-exporter
    # sidecar (see docker-compose.observability.yml). Never exposed publicly.
    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 172.16.0.0/12; # docker bridge / compose network range
        deny all;
    }

    # SPA routing: let React Router handle unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively; index.html stays revalidated
    location ~* \.(js|css|png|jpg|jpeg|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
