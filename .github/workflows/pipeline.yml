name: CI/CD & Security Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Scan hebdomadaire des vulnérabilités
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-app

jobs:
  # =========================================================================
  # 1. CONTINUOUS INTEGRATION (CI)
  # =========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ecommerce-app/package-lock.json
      - run: npm ci
      - run: npm run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ecommerce-app/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ecommerce-app/coverage
          retention-days: 14

  build-app:
    name: App Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: ecommerce-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ecommerce-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ecommerce-app/dist
          retention-days: 7

  # =========================================================================
  # 2. SECURITY & STATIC ANALYSIS
  # =========================================================================
  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency scan (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ecommerce-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm audit --audit-level=high

  container-scan:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    needs: [codeql, secret-scan, dependency-scan]
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Build image (local scan)
        run: docker build -t ecommerce-app:scan ./ecommerce-app
      - name: Scan image with Trivy (SARIF report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecommerce-app:scan
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Upload Trivy results
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: "Scan image with Trivy (Gate: CRITICAL fixable)"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ecommerce-app:scan
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # =========================================================================
  # 3. CONTINUOUS DEPLOYMENT (CD)
  # =========================================================================
  build-and-push:
    name: Build, Sign & Push Image
    runs-on: ubuntu-latest
    # S'exécute uniquement sur un push master ET si la CI et la Sécurité ont réussi
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    needs: [build-app, container-scan]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable='${{ github.ref == 'refs/heads/master' }}'

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./ecommerce-app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, OIDC)
        run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        continue-on-error: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: 
        name: production
    steps:
      - name: Deploy notification (placeholder)
        run: |
          echo "Deploying ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          echo "Replace this step with: kubectl set image / helm upgrade / docker compose pull && up -d"