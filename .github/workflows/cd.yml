name: CD

on:
  workflow_run:
    workflows: ["CI", "Security"]
    branches: [master]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    name: Build, sign & push image
    runs-on: ubuntu-latest
    # Déclenche le job uniquement si le workflow parent s'est terminé avec succès
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      # Configuration de Buildx pour éviter l'erreur de cache
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in CLI Docker (évite l'erreur d'en-tête malformé)
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-app
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./ecommerce-app
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, OIDC)
        run: cosign sign --yes docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-app@${{ steps.build.outputs.digest }}
        continue-on-error: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
    steps:
      - name: Deploy notification (placeholder)
        run: |
          echo "Deploying ${{ secrets.DOCKERHUB_USERNAME }}/ecommerce-app:latest"
          echo "Replace this step with: kubectl set image / helm upgrade / docker compose pull && up -d"